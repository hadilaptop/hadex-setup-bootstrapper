name: Build and publish Hadex setup bundle

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download portable Node.js LTS runtime
        shell: pwsh
        run: |
          $index = Invoke-RestMethod 'https://nodejs.org/dist/index.json'
          $entry = $index | Where-Object { $_.version -match '^v22\.' -and $_.lts } | Select-Object -First 1
          if (-not $entry) { throw 'Could not find a Node.js 22 LTS release.' }
          $zipName = "node-$($entry.version)-win-x64.zip"
          $url = "https://nodejs.org/dist/$($entry.version)/$zipName"
          Invoke-WebRequest -Uri $url -OutFile $zipName
          Expand-Archive -LiteralPath $zipName -DestinationPath .node-runtime -Force
          New-Item -ItemType Directory -Path dist\package\runtime -Force | Out-Null
          Copy-Item -Path ".node-runtime\node-$($entry.version)-win-x64\*" -Destination dist\package\runtime -Recurse -Force

      - name: Install bundled Hadex Chromium runtime
        shell: pwsh
        run: |
          Push-Location 'payload\Hadex Chromium'
          npm install --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Hadex Chromium dependency installation failed.' }
          Pop-Location

      - name: Install automation dependencies
        shell: pwsh
        run: |
          foreach ($dir in @('payload\apps\key-creator','payload\apps\tunnels','payload\apps\plugins')) {
            Push-Location $dir
            npm install --omit=dev --no-audit --no-fund
            if ($LASTEXITCODE -ne 0) { throw "Dependency installation failed in $dir" }
            Pop-Location
          }

      - name: Assemble temporary setup bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist\package -Force | Out-Null
          Copy-Item -LiteralPath 'HadexSetup.ps1' -Destination 'dist\package\HadexSetup.ps1' -Force
          Copy-Item -LiteralPath 'payload' -Destination 'dist\package\payload' -Recurse -Force
          $zip = 'dist\hadex-setup-win-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path 'dist\package\*' -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath "$zip.sha256" -Value "$hash  hadex-setup-win-x64.zip" -NoNewline
          Write-Host "Bundle size: $((Get-Item $zip).Length) bytes"
          Write-Host "SHA-256: $hash"

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $tag = '${{ inputs.release_tag }}'
          } elseif ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'
          } else {
            $tag = 'v1.0.0'
          }
          if (-not $tag -or $tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Invalid release tag: $tag (expected vMAJOR.MINOR.PATCH)"
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Hadex setup $tag" --notes "One-time Windows setup bundle. The API key is saved locally; browser/session data is temporary."
            if ($LASTEXITCODE -ne 0) { throw 'Could not create GitHub Release.' }
          }
          gh release upload $tag 'dist\hadex-setup-win-x64.zip' 'dist\hadex-setup-win-x64.zip.sha256' --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload setup release assets.' }
          gh release edit $tag --latest
