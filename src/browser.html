<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hadex Chrome</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { position: relative; font-family: "Segoe UI", Tahoma, sans-serif; background: #fff; color: #20242a; }
  webview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: white; }
  /* Floating return button inside the main (webview) frame — no separate bar */
  #return { position: absolute; top: 8px; left: 8px; z-index: 2; height: 24px; padding: 0 10px; border: 1px solid #172b4d; border-radius: 7px; background: #172b4d; color: #fff; cursor: pointer; font: 11px "Segoe UI", Tahoma, sans-serif; white-space: nowrap; box-shadow: 0 1px 4px rgba(16,32,64,.25); }
  #return:hover { background: #1f3a66; }
</style>
</head>
<body>
<webview id="browser" src="https://accounts.google.com/v3/signin/identifier?continue=https://www.google.com/&ec=futura_exp_og_so_72776762_e&hl=en&passive=true&flowName=WebLiteSignIn&flowEntry=ServiceLogin&dsh=S1932342983:1793350482962552" partition="persist:hadex-private-browser" allowpopups></webview>
<button id="return" type="button">بازگشت به نصب</button>
<script>
  const view = document.getElementById('browser');
  document.getElementById('return').addEventListener('click', () => window.hadexBrowser.showInstaller());
</script>
</body>
</html>
