<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hadex Setup</title><link rel="stylesheet" href="style.css"></head>
<body><main class="panel">
