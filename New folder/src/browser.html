<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hadex Chromium</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
  body { position: relative; font-family: "Segoe UI", Tahoma, sans-serif; background: #fff; color: #20242a; }
  webview { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; background: white; }
  /* Floating return button inside the main (webview) frame — no separate bar */
  #return { position: absolute; top: 8px; left: 8px; z-index: 2; height: 24px; padding: 0 10px; border: 1px solid #172b4d; border-radius: 7px; background: #172b4d; color: #fff; cursor: pointer; font: 11px "Segoe UI", Tahoma, sans-serif; white-space: nowrap; box-shadow: 0 1px 4px rgba(16,32,64,.25); }
  #return:hover { background: #1f3a66; }
</style>
</head>
<body>
<webview id="browser" src="https://accounts.google.com/v3/signin/identifier?continue=https://www.google.com/&ec=futura_exp_og_so_72776762_e&hl=en&passive=true&flowName=WebLiteSignIn&flowEntry=ServiceLogin&dsh=S1932342983:1793350482962552" partition="persist:hadex-private-browser" allowpopups></webview>
<button id="return" type="button">بازگشت به نصب</button>
<script>
  const view = document.getElementById('browser');
  document.getElementById('return').addEventListener('click', () => window.hadexBrowser.showInstaller());

  // ==== Auto-fit: each page is zoomed (shrunk) to exactly fill the webview ====
  // width : scale down so the full page width is visible (no horizontal scroll)
  // height: scale down so the full page height is visible too (no vertical scroll)
  // min   : smallest allowed zoom factor (0.25 is the Chromium minimum)
  const FIT = { width: true, height: true, min: 0.25 };
  let fitToken = 0;
  const FIT_METRICS_JS = `(async () => {
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    const de = document.documentElement, b = document.body;
    return {
      w: Math.max(de.scrollWidth, b ? b.scrollWidth : 0),
      h: Math.max(de.scrollHeight, b ? b.scrollHeight : 0)
    };
  })()`;
  async function applyFit() {
    try {
      const rect = view.getBoundingClientRect();
      if (rect.width < 50 || rect.height < 50) return;
      view.setZoomFactor(1); // measure at natural size first, then shrink
      const m = await view.executeJavaScript(FIT_METRICS_JS, true);
      if (!m || view.getBoundingClientRect().width < 50) return;
      const r = view.getBoundingClientRect();
      let factor = 1;
      if (FIT.width && m.w > 0) factor = Math.min(factor, r.width / m.w);
      if (FIT.height && m.h > 0) factor = Math.min(factor, r.height / m.h);
      factor = Math.min(1, Math.max(FIT.min, factor));
      view.setZoomFactor(factor);
    } catch (err) { /* guest page not ready yet; a later run will retry */ }
  }
  function scheduleFit() {
    const token = fitToken;
    // Run a few times: page layout can still change while fonts/images load
    [0, 300, 800].forEach(delay => setTimeout(() => { if (token === fitToken) applyFit(); }, delay));
  }
  // ============================================================================

  view.addEventListener('did-navigate', () => { fitToken++; scheduleFit(); });
  view.addEventListener('did-navigate-in-page', () => { fitToken++; scheduleFit(); });
  view.addEventListener('dom-ready', scheduleFit);
  view.addEventListener('did-stop-loading', scheduleFit);
  scheduleFit();
</script>
</body>
</html>
